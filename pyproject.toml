[project]
name = "foodvision-ai"
version = "1.0.0"
description = "FoodVision AI Backend & Recommendation Engine"
requires-python = ">=3.11"

[tool.pyrefly]
search-path = ["backend", "."]

[tool.pyright]
extraPaths = ["backend", "."]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

