# Proposed design contract; not an implementation report.
openapi: 3.1.0
info:
  title: FoodVision AI REST API — Proposed Contract
  version: 1.0.0
  description: Hợp đồng thiết kế cho đồ án Phát triển các hệ thống thông minh, chưa khẳng định các endpoint đã triển
    khai. Body và dữ liệu ví dụ thuộc docs/03-api.
servers:
- url: http://localhost:8000/api/v1
  description: Backend local đề xuất
tags:
- name: Health
- name: Catalog
- name: Recipes
- name: AI
- name: Recommendations
- name: Favorites
- name: Feedback
- name: AdminRecipes
- name: AdminIngredients
- name: AdminNutrition
- name: AdminAI
- name: AdminAudit
- name: ScanHistory
paths:
  /health:
    get:
      tags:
      - Health
      summary: Kiểm tra sức khỏe API
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - degraded
                additionalProperties: false
                required:
                - status
      operationId: healthCheck
  /ingredients:
    get:
      tags:
      - Catalog
      summary: Danh mục nguyên liệu (active)
      description: Public endpoint (không cần Bearer token), chỉ trả các nguyên liệu có is_active=true. Hỗ trợ lọc theo category hoặc exclude_pantry; nếu gửi đồng thời category=pantry và exclude_pantry=true sẽ trả 422 INVALID_QUERY_PARAMS.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedIngredients'
        '422':
          description: Tham số truy vấn không hợp lệ hoặc mâu thuẫn (INVALID_QUERY_PARAMS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: q
        in: query
        required: false
        schema: &id001
          type: string
      - name: category
        in: query
        required: false
        schema: &id010
          type: string
          enum:
          - vegetable
          - protein
          - seafood
          - spice
          - pantry
          - other
      - name: exclude_pantry
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      operationId: listIngredients
  /nutrition-tags:
    get:
      tags:
      - Catalog
      summary: Danh sách nhóm dinh dưỡng định tính
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NutritionTag'
      operationId: listNutritionTags
  /recipes:
    get:
      tags:
      - Recipes
      summary: Tìm kiếm món published
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedRecipes'
      parameters:
      - name: q
        in: query
        required: false
        schema: *id001
      - name: cuisine_code
        in: query
        required: false
        schema:
          type: string
          enum:
          - VN
          - EU
          - US
      - name: max_total_minutes
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 720
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      operationId: listRecipes
  /recipes/{recipe_id}:
    get:
      tags:
      - Recipes
      summary: Lấy món published và các bước
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDetail'
        '404':
          description: Không tìm thấy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: recipe_id
        in: path
        required: true
        schema: &id002
          type: string
          format: uuid
      operationId: getRecipe
  /ai/detect:
    post:
      tags:
      - AI
      summary: Nhận diện nhiều nguyên liệu từ 1 ảnh
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectResponse'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Quá giới hạn dung lượng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Kiểu ảnh không hỗ trợ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Quá giới hạn request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service không sẵn sàng (MODEL_NOT_READY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Quá thời gian suy luận (INFERENCE_TIMEOUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                save_history: &id003
                  type: boolean
              additionalProperties: false
              required:
              - file
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      description: Ảnh tối đa 5 MiB, JPEG/PNG/WebP. Backend tự xoay ảnh theo EXIF Orientation và xóa sạch metadata EXIF/GPS trước khi suy luận; bbox chuẩn hóa trên ảnh đã xoay. Guest được phép nếu save_history=false; save_history=true cần Bearer JWT; không lưu ảnh gốc. Response scan_id=null nếu không lưu.
      operationId: detectIngredients
      security:
      - {}
      - bearerAuth: []
  /recommendations:
    post:
      tags:
      - Recommendations
      summary: Xếp hạng món từ nguyên liệu đã xác nhận
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendResponse'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy hoặc không thuộc chủ sở hữu scan_id (SCAN_NOT_OWNED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Dữ liệu không hợp lệ (INVALID_INGREDIENTS hoặc VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Quá giới hạn request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendRequest'
      description: ingredient_ids là danh sách nguyên liệu chính cuối cùng sau khi User sửa (category != 'pantry'); excluded_pantry_ids là danh sách gia vị nền (category = 'pantry') mà người dùng báo đang thiếu. Nếu scan_id khác null thì bearer token phải thuộc chủ sở hữu scan (nếu không trả 404 SCAN_NOT_OWNED). cuisine_codes là lọc cứng, preferred_cuisine_codes là ưu tiên mềm.
      operationId: recommendRecipes
      security:
      - {}
      - bearerAuth: []
  /favorites:
    get:
      tags:
      - Favorites
      summary: Danh sách yêu thích riêng của User
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedFavorites'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      security:
      - bearerAuth: []
      operationId: listFavorites
    post:
      tags:
      - Favorites
      summary: Lưu món yêu thích, idempotent
      responses:
        '201':
          description: Tạo mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteView'
        '200':
          description: Đã có sẵn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteView'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteCreate'
      security:
      - bearerAuth: []
      operationId: addFavorite
  /favorites/{recipe_id}:
    delete:
      tags:
      - Favorites
      summary: Bỏ món yêu thích
      responses:
        '204':
          description: Đã xóa hoặc chưa lưu
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: recipe_id
        in: path
        required: true
        schema: *id002
      security:
      - bearerAuth: []
      operationId: removeFavorite
  /feedback:
    post:
      tags:
      - Feedback
      summary: Đánh giá mức hữu ích gợi ý (1..5), upsert theo (user_id, recipe_id, scan_id)
      description: Tạo mới (201) hoặc cập nhật (200) đánh giá cho cùng tổ hợp (user_id, recipe_id, scan_id) với UNIQUE NULLS NOT DISTINCT. Nếu scan_id không tồn tại hoặc thuộc người dùng khác sẽ trả 404 SCAN_NOT_OWNED.
      responses:
        '201':
          description: Tạo mới đánh giá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackView'
        '200':
          description: Cập nhật đánh giá hiện có trong cùng ngữ cảnh (user_id, recipe_id, scan_id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackView'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy món hoặc scan_id không tồn tại/không thuộc chủ sở hữu (RECIPE_NOT_FOUND / SCAN_NOT_OWNED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackCreate'
      security:
      - bearerAuth: []
      operationId: submitFeedback
  /admin/recipes:
    post:
      tags:
      - AdminRecipes
      summary: Tạo recipe draft
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRecipeView'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Xung đột
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeCreate'
      security:
      - bearerAuth: []
      operationId: createRecipe
    get:
      tags:
      - AdminRecipes
      summary: Danh sách món bao gồm draft và archived
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAdminRecipes'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - draft
          - published
          - archived
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      security:
      - bearerAuth: []
      operationId: listAdminRecipes
  /admin/recipes/{recipe_id}:
    patch:
      tags:
      - AdminRecipes
      summary: Sửa recipe (transaction; thay sublists nếu có)
      description: Cập nhật thông tin, danh sách ingredients và steps của công thức trong một transaction. Nếu công thức đang ở trạng thái published, mọi thay đổi vẫn phải thỏa điều kiện xuất bản (BR-01, BR-05); nếu vi phạm trả 400 RECIPE_NOT_PUBLISHABLE.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRecipeView'
        '400':
          description: Vi phạm điều kiện xuất bản khi sửa công thức đang published (RECIPE_NOT_PUBLISHABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Xung đột
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipePatch'
      parameters:
      - name: recipe_id
        in: path
        required: true
        schema: *id002
      security:
      - bearerAuth: []
      operationId: patchRecipe
    get:
      tags:
      - AdminRecipes
      summary: Xem chi tiết recipe draft/archived để chỉnh sửa
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRecipeDetail'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: recipe_id
        in: path
        required: true
        schema: *id002
      security:
      - bearerAuth: []
      operationId: getAdminRecipe
  /admin/recipes/{recipe_id}/status:
    patch:
      tags:
      - AdminRecipes
      summary: Công bố/ẩn recipe sau kiểm tra điều kiện
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRecipeView'
        '400':
          description: Thất bại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeStatusPatch'
      parameters:
      - name: recipe_id
        in: path
        required: true
        schema: *id002
      security:
      - bearerAuth: []
      operationId: setRecipeStatus
  /admin/ingredients:
    get:
      tags:
      - AdminIngredients
      summary: Danh sách nguyên liệu gồm cả inactive
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedIngredients'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: q
        in: query
        required: false
        schema: *id001
      - name: category
        in: query
        required: false
        schema: *id010
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      security:
      - bearerAuth: []
      operationId: listAdminIngredients
    post:
      tags:
      - AdminIngredients
      summary: Tạo nguyên liệu và alias
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Xung đột
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientCreate'
      security:
      - bearerAuth: []
      operationId: createIngredient
  /admin/ingredients/{ingredient_id}:
    patch:
      tags:
      - AdminIngredients
      summary: Sửa nguyên liệu, alias
      description: Nếu đổi category (đặc biệt sang/từ pantry) hoặc đặt is_active=false cho nguyên liệu đang nằm trong công thức published hoặc đang được ánh xạ bởi ai_labels của model draft/active, trả 400 INGREDIENT_IN_USE.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '400':
          description: Nguyên liệu đang được sử dụng, không thể tắt hoặc đổi phân loại (INGREDIENT_IN_USE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Xung đột
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientPatch'
      parameters:
      - name: ingredient_id
        in: path
        required: true
        schema: *id002
      security:
      - bearerAuth: []
      operationId: patchIngredient
  /admin/ingredients/{ingredient_id}/nutrition-tags:
    put:
      tags:
      - AdminNutrition
      summary: Thay toàn bộ ánh xạ nhóm chất có căn cứ
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NutritionEvidence'
        '401':
