components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token
  schemas:
    ErrorResponse:
      type: object
      properties:
        code: *id001
        message: *id001
        details:
          type: object
          additionalProperties: true
        request_id: *id001
      additionalProperties: false
      required:
      - code
      - message
      - details
      - request_id
    PagedIngredients:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 50
        offset:
          type: integer
          minimum: 0
      additionalProperties: false
      required:
      - items
      - total
      - limit
      - offset
    Ingredient:
      type: object
      properties:
        id: *id002
        slug: *id001
        name_vi: *id001
        category: *id010
        is_active: *id003
      additionalProperties: false
      required:
      - id
      - slug
      - name_vi
      - category
      - is_active
    NutritionTag:
      type: object
      properties:
        id: *id002
        code: *id001
        name_vi: *id001
        description: *id001
        is_active: *id003
      additionalProperties: false
      required:
      - id
      - code
      - name_vi
      - description
      - is_active
    NutritionEvidence:
      type: object
      properties:
        tag:
          $ref: '#/components/schemas/NutritionTag'
        source_urls:
          type: array
          items:
            type: string
            format: uri
        note:
          anyOf:
          - *id001
          - type: 'null'
      additionalProperties: false
      required:
      - tag
      - source_urls
      - note
    RecipeIngredientView:
      type: object
      properties:
        ingredient_id: *id002
        name_vi: *id001
        category: *id010
        is_required: *id003
        display_quantity:
          anyOf:
          - *id001
          - type: 'null'
        sort_order:
          type: integer
      additionalProperties: false
      required:
      - ingredient_id
      - name_vi
      - category
      - is_required
      - display_quantity
      - sort_order
    RecipeStepView:
      type: object
      properties:
        step_no:
          type: integer
          minimum: 1
        instruction: *id001
        estimated_minutes:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
      additionalProperties: false
      required:
      - step_no
      - instruction
      - estimated_minutes
    RecipeSummary:
      type: object
      properties:
        id: *id002
        slug: *id001
        name_vi: *id001
        cuisine_code: &id004
          type: string
          enum:
          - VN
          - EU
          - US
        prep_minutes: &id005
          type: integer
          minimum: 0
          description: Thời gian sơ chế (phút).
        cook_minutes: &id006
          type: integer
          minimum: 0
          description: Thời gian chế biến trên bếp cộng thời gian ướp/chờ/hầm bắt buộc trong quy trình (phút).
        total_minutes: &id007
          type: integer
          minimum: 0
          description: Tổng thời gian hoàn thành món (prep_minutes + cook_minutes).
        cover_image_url: &id008
          anyOf:
          - *id001
          - type: 'null'
      additionalProperties: false
      required:
      - id
      - slug
      - name_vi
      - cuisine_code
      - prep_minutes
      - cook_minutes
      - total_minutes
      - cover_image_url
    RecipeDetail:
      type: object
      properties:
        id: *id002
        slug: *id001
        name_vi: *id001
        cuisine_code: *id004
        prep_minutes: *id005
        cook_minutes: *id006
        total_minutes: *id007
        cover_image_url: *id008
        description:
          anyOf:
          - *id001
          - type: 'null'
        country_code:
          anyOf:
          - *id001
          - type: 'null'
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/RecipeIngredientView'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/RecipeStepView'
        nutrition_evidence:
          type: array
          items:
            $ref: '#/components/schemas/NutritionEvidence'
        source_name:
          anyOf:
          - *id001
          - type: 'null'
        source_url:
          anyOf:
          - *id001
          - type: 'null'
        content_license:
          anyOf:
          - *id001
          - type: 'null'
      additionalProperties: false
      required:
      - id
      - slug
      - name_vi
      - cuisine_code
      - prep_minutes
      - cook_minutes
      - total_minutes
      - cover_image_url
      - description
      - country_code
      - ingredients
      - steps
      - nutrition_evidence
      - source_name
      - source_url
      - content_license
    PagedRecipes:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecipeSummary'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 50
        offset:
          type: integer
          minimum: 0
      additionalProperties: false
      required:
      - items
      - total
      - limit
      - offset
    BBox:
      type: object
      properties:
        x1:
          type: number
          minimum: 0
          maximum: 1
        y1:
          type: number
          minimum: 0
          maximum: 1
        x2:
          type: number
          minimum: 0
          maximum: 1
        y2:
          type: number
          minimum: 0
          maximum: 1
      additionalProperties: false
      required:
      - x1
      - y1
      - x2
      - y2
      description: Tọa độ xyxy chuẩn hóa [0..1], và x1<x2, y1<y2 kiểm tra thêm ở backend.
    Detection:
      type: object
      properties:
        class_index:
          type: integer
          minimum: 0
        class_name: *id001
        ingredient_id:
          anyOf:
          - *id002
          - type: 'null'
        ingredient_name:
          anyOf:
          - *id001
          - type: 'null'
        confidence:
          type: number
          minimum: 0
          maximum: 1
        bbox:
          $ref: '#/components/schemas/BBox'
      additionalProperties: false
      required:
      - class_index
      - class_name
      - ingredient_id
      - ingredient_name
      - confidence
      - bbox
    SuggestedIngredient:
      type: object
      properties:
        ingredient_id: *id002
        name_vi: *id001
        max_confidence:
          type: number
          minimum: 0
          maximum: 1
      additionalProperties: false
      required:
      - ingredient_id
      - name_vi
      - max_confidence
    DetectResponse:
      type: object
      properties:
        scan_id:
          anyOf:
          - *id002
          - type: 'null'
        model_version: *id001
        detections:
          type: array
          items:
            $ref: '#/components/schemas/Detection'
        suggested_ingredients:
          type: array
          items:
            $ref: '#/components/schemas/SuggestedIngredient'
      additionalProperties: false
      required:
      - scan_id
      - model_version
      - detections
      - suggested_ingredients
    RecommendRequest:
      type: object
      properties:
        ingredient_ids:
          type: array
          items: *id002
          minItems: 1
          uniqueItems: true
        excluded_pantry_ids:
          type: array
          items: *id002
          uniqueItems: true
          default: []
        max_total_minutes:
          anyOf:
          - type: integer
            minimum: 1
            maximum: 720
          - type: 'null'
        cuisine_codes:
          type: array
          items:
            type: string
            enum:
            - VN
            - EU
            - US
        preferred_cuisine_codes:
          type: array
          items:
            type: string
            enum:
            - VN
            - EU
            - US
        include_missing: *id003
        limit:
          type: integer
          minimum: 1
          maximum: 50
        scan_id:
          anyOf:
          - *id002
          - type: 'null'
      additionalProperties: false
